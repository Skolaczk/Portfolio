name: Code check

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Biome, Typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: npm install
      - name: Biome
        run: npm run lint
      - name: Type check
        run: npm run typecheck
